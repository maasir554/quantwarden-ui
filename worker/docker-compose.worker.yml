services:
  quantwarden-scan-worker:
    build:
      context: ..
      dockerfile: worker/Dockerfile
    image: quantwarden-scan-worker:latest
    container_name: quantwarden-scan-worker
    restart: unless-stopped
    env_file:
      - ../.env.worker
    environment:
      NODE_ENV: production
      SCAN_WORKER_EXECUTOR_TICK_MS: ${SCAN_WORKER_EXECUTOR_TICK_MS:-1500}
      SCAN_WORKER_SCHEDULER_TICK_MS: ${SCAN_WORKER_SCHEDULER_TICK_MS:-10000}
      SCAN_WORKER_ACTIVE_ORG_LIMIT: ${SCAN_WORKER_ACTIVE_ORG_LIMIT:-100}
